name: Build Kernel
permissions:
  contents: write
  actions: write
'on':
  workflow_dispatch:
    inputs:
      target_devices:
        description: target device (munch/alioth/etc)
        required: true
        type: choice
        options:
        - umi
        - cmi
        - cas
        - thyme
        - munch
        - dagu
        - elish
        - enuma
        - alioth
        - apollo
        - lmi
        - psyche
        - pipa
        - all
      compiled_system:
        description: system type (MIUI/AOSP)
        required: true
        type: choice
        default: MIUI
        options:
        - MIUI
        - AOSP
      kernelsu_variant:
        description: KernelSU variant
        required: true
        type: choice
        default: KernelSU
        options:
        - KernelSU
        - RKSU
        - None
      kpm_enable:
        description: KPM support
        required: true
        type: choice
        default: disable
        options:
        - enable
        - disable
      droidspaces_enable:
        description: Droidspaces / LXC / Docker support
        required: true
        type: choice
        default: disable
        options:
        - enable
        - disable
      kernel_version:
        description: custom kernel version
        required: false
        type: string
        default: ''
      build_type:
        description: Release or Dev
        required: true
        type: choice
        default: Release
        options:
        - Release
        - Dev
jobs:
  placeholder:
    runs-on: ubuntu-latest
    steps:
    - run: echo "Workflow rebuilt from scratch - OK"
