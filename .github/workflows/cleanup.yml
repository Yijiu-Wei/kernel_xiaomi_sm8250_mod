name: Initialize Disk

on:
  workflow_dispatch:

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Initialize Runner Disk
        run: |
          echo "========================================="
          echo "        磁盘初始化 / DISK INIT"
          echo "========================================="
          echo ""
          echo "=== 清理前 ==="
          df -h /

          echo ""
          echo ">>> 1. 删除 Android SDK / NDK"
          sudo rm -rf /usr/local/lib/android

          echo ">>> 2. 删除 .NET / Mono"
          sudo rm -rf /usr/share/dotnet /usr/lib/mono
          sudo rm -rf /home/runner/.dotnet

          echo ">>> 3. 删除 Java / GraalVM"
          sudo rm -rf /usr/lib/jvm /usr/local/graalvm

          echo ">>> 4. 删除 Swift / Rust / Go / Cargo"
          sudo rm -rf /usr/share/swift /usr/share/rust
          sudo rm -rf /usr/local/go /usr/share/miniconda
          sudo rm -rf /home/runner/.cargo /home/runner/go

          echo ">>> 5. 删除 AWS / Azure / Google 工具"
          sudo rm -rf /usr/local/aws-cli /usr/local/aws-sam-cli
          sudo rm -rf /opt/az /opt/google /opt/microsoft

          echo ">>> 6. 删除 Node / Python / Ruby 缓存"
          sudo rm -rf /home/runner/.npm /home/runner/.cache/pip
          sudo rm -rf /var/lib/gems

          echo ">>> 7. 删除 Firefox / 浏览器"
          sudo rm -rf /usr/lib/firefox /usr/lib/firefox-addons

          echo ">>> 8. 删除工具链缓存"
          sudo rm -rf /opt/hostedtoolcache /opt/ghc /opt/pipx
          sudo rm -rf /usr/local/share/boost

          echo ">>> 9. 清理包管理缓存"
          sudo apt clean -y 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /var/cache/apt/archives/*.deb
          sudo rm -rf /var/cache/snapd/*

          echo ">>> 10. 清理日志和临时文件"
          sudo rm -rf /tmp/* /var/tmp/*
          sudo journalctl --rotate 2>/dev/null
          sudo journalctl --vacuum-size=1M 2>/dev/null || true

          echo ""
          echo "========================================="
          echo "            清理完成"
          echo "========================================="
          echo ""
          echo "=== 清理后 ==="
          df -h /
          echo ""
          echo "=== 最大目录 Top 10 ==="
          sudo du -sh /* 2>/dev/null | sort -rh | head -10
