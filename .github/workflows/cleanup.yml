name: Cleanup Disk

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 🧹 Deep Clean Runner Disk
        run: |
          echo "========================================="
          echo "          DISK CLEANUP START"
          echo "========================================="
          echo ""
          echo "=== Before ==="
          df -h /

          echo ""
          echo "=== 1. Remove hosted tool caches ==="
          sudo rm -rf /opt/hostedtoolcache /opt/ghc /opt/pipx /opt/microsoft /opt/google
          sudo rm -rf /opt/az

          echo ""
          echo "=== 2. Remove Android SDK & NDK ==="
          sudo rm -rf /usr/local/lib/android

          echo ""
          echo "=== 3. Remove .NET and Mono ==="
          sudo rm -rf /usr/share/dotnet /usr/lib/mono
          sudo rm -rf /home/runner/.dotnet

          echo ""
          echo "=== 4. Remove Java JDKs ==="
          sudo rm -rf /usr/lib/jvm /usr/local/graalvm

          echo ""
          echo "=== 5. Remove Python/Ruby/Node.js artifacts ==="
          sudo rm -rf /home/runner/.cache/pip /home/runner/.npm
          sudo rm -rf /var/lib/gems
          sudo rm -rf /usr/share/miniconda

          echo ""
          echo "=== 6. Remove large shared libs ==="
          sudo rm -rf /usr/share/swift /usr/share/rust
          sudo rm -rf /usr/local/go /usr/local/aws-cli /usr/local/aws-sam-cli
          sudo rm -rf /usr/local/share/boost

          echo ""
          echo "=== 7. Remove Cargo & Go artifacts ==="
          sudo rm -rf /home/runner/.cargo /home/runner/go

          echo ""
          echo "=== 8. Remove Firefox and browsers ==="
          sudo rm -rf /usr/lib/firefox /usr/lib/firefox-addons
          sudo rm -rf /home/runner/.local/share

          echo ""
          echo "=== 9. Clean package caches ==="
          sudo apt clean -y 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /var/cache/apt/archives/*.deb
          sudo rm -rf /var/cache/snapd/*

          echo ""
          echo "=== 10. Clean temporary files ==="
          sudo rm -rf /tmp/* /var/tmp/*
          sudo journalctl --rotate 2>/dev/null
          sudo journalctl --vacuum-size=1M 2>/dev/null || true

          echo ""
          echo "========================================="
          echo "          DISK CLEANUP DONE"
          echo "========================================="
          echo ""
          echo "=== After ==="
          echo "Largest directories remaining:"
          sudo du -sh /* 2>/dev/null | sort -rh | head -15
          echo ""
          df -h /
